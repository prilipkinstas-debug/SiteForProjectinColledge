server {
    listen 80;
    server_name localhost;

    # 1. Раздача статических HTML файлов (ваша папка ./html)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html; # для SPA (если нужно)
    }

    # 2. Проксирование запросов к Go-сервису
    # Все запросы на http://localhost:8089/api/go/ пойдут в Go
    location /api/go/ {
        # ВАЖНО: внутри Docker используем имя сервиса из docker-compose, а не localhost!
        # Замените 8080 на реальный порт, который слушает ваш Go-контейнер
        proxy_pass http://go-service:8080/; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 3. Проксирование запросов к Python-сервису
    # Все запросы на http://localhost:8089/api/python/ пойдут в Python
    location /api/python/ {
        # Замените 8000 на реальный порт, который слушает ваш Python-контейнер
        proxy_pass http://python-service:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}