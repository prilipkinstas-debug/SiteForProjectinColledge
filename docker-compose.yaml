services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=qweR12345678
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHEll", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P qweR12345678 -C -Q 'SELECT 1' || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s

  go-service:
    image: golang:1.22-alpine
    working_dir: /app
    volumes:
      -./go:/app
    command: >
      sh -c "go mod tidy && go run main.go"
    environment:
      - DB_HOST=mssql
      - DB_USER=02cm
      - DB_PASSWORD=${02cm}
    depends_on:
      - mssql
    networks:
      - app_networks
        
  python-service:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      -./python:/app
    command: bash -c "pip install pymssql && python app.py"
    environment:
      - DB_HOST=mssql
      - DB_USER=Specialist
      - DB_PASSWORD=${Specialist}
    depends_on:
      - mssql
    networks:
      - app_networks
  php-service:
    build: .
    depends_on:
      - mssql
    volumes:
      -./php:/var/www/html
    environment:
      - DB_HOST=mssql
      - DB_USER=Amit
      - DB_PASSWORD=${Amit}
    networks:
      - app_networks
  nginx:
    image: nginx:latest
    ports:
      - "8089:80"
    depends_on:
      - go-service
      - php-service
      - python-service

volumes:
  mssql_data:
networks:
  app_networks:
    drive: bridge
